# @package _global_

# Environment selection
task: truss-velocity-command-right # Registered task key from env/mujoco.py.
env_name: ${task} # Display/logging name for the selected environment.
obs: state # Observation type expected by the MuJoCo environment factory.
xml_path: env/truss/assets/Baseline/octahedron_velocity_integrated_ctr.xml # MuJoCo XML model used by the truss environment.
truss_topology: octahedron # mujoco-truss-gen preset used by unified truss envs.
truss_topologies: null # Optional list of mujoco-truss-gen presets for multi-topology runs.
topologies: null # Alias for truss_topologies; useful for CLI sweeps.
truss_realistic: false # Whether unified truss envs should request realistic generated models.
truss_graph_view: auto # Graph view for unified graph envs: auto, physical, or logical.

# Simulation timing
mujoco_backend: mujoco # Backend: mjx selects batch-native fixed-topology graph simulation; mujoco uses Gym environments.
eval_backend: mujoco # Evaluation backend. Native MuJoCo supports fast single-env evaluation and rendering during MJX training.
mjx_zero_copy: true # Exchange MJX observations/actions with PyTorch through DLPack when both use the same device.
mjx_impl: jax # MJX physics implementation: jax (default) or warp (NVIDIA CUDA only).
warp_graph_mode: warp_staged # Fastest Warp mode in the matched A100 benchmark; alternatives: warp, warp_staged_ex.
warp_naconmax: null # Optional fixed Warp contact capacity; null lets upstream choose.
warp_njmax: null # Optional fixed Warp constraint capacity; null lets upstream choose.
max_steps: 1_000 # Maximum simulator steps before the Timeout wrapper truncates an episode.
episode_length: ${max_steps} # Nominal episode length used before make_env overwrites it from the wrapper.
nsubsteps: 100 # Number of MuJoCo integration steps per environment step.
action_repeat: 1 # Number of repeated environment actions; kept for trainer compatibility.

# Truss velocity-control action settings
speed: 0.05 # Scale from normalized policy action [-1, 1] to actuator control delta/velocity.
action_low: -1.0 # Lower bound of the normalized policy action space.
action_high: 1.0 # Upper bound of the normalized policy action space.

# Reward and termination
forward_weight: 19.65175423 # Reward multiplier for commanded center-of-mass velocity.
energy_weight: 0.1 # Penalty multiplier on squared actuator command magnitude.
alive_bonus: 0.1 # Reward added each step while the structure remains valid.
rigidity_weight: 0.1 # Reward multiplier for graph env worst-case rigidity metric.
slip_weight: 0.1215063801500649 # Penalty multiplier for horizontal velocity at low-contact nodes.
slip_height: 0.1879452990963082 # Height threshold used to decide which nodes count as ground contacts.
critical_eig_threshold: 0.0001 # Terminate when the active rigidity metric falls below this value.

# Flat observation/action dimensions. make_env overwrites action_dim from the Gym space.
obs_dim: 44 # Flat default octahedron observation size (overwritten at runtime).
action_dim: 8 # Number of normalized tendon actuator commands.

# Evaluation and rendering
render_mode: rgb_array # Preferred render mode when videos are enabled.
success_threshold: null # Optional reward/success threshold; null means the env info controls success.
terminate_on_success: false # Whether future success-aware wrappers should end episodes early.

# Topology metadata for graph-based robot experiments.
topology_id: octahedron # Stable identifier for the default robot topology.
use_graph_observations: false # Whether observations should be emitted as graph data instead of flat tensors.
node_feature_dim: 6 # Per-node graph feature width: relative xyz position + xyz velocity.
edge_feature_dim: 0 # Per-edge feature width for future graph observations.
effective_node_feature_dim: 6 # Resolved policy input width after configurable graph features.
edge_role_vocabulary: [tube, connector, virtual] # Stable semantic order used by edge-role one-hot features.
graph_features:
  node_roles: false # Append [actuated, passive] to each physical node observation.
  edge_roles: false # Append [tube, connector, virtual] to each directed message edge.
  edge_distance: false # Append endpoint distance computed from the observed xyz coordinates.
num_nodes: 6 # Number of node bodies in the default octahedron XML.
num_edges: 12 # Number of structural/actuated tendon edges in the default octahedron XML.
num_actuated_edges: 8 # Number of tendon edges controlled by the policy.
normalize_observations: true # Whether future wrappers should normalize observation features.
normalize_rewards: false # Normalize training rewards using task-specific discounted-return variance.
reward_norm_gamma: null # Discount for normalization returns; null uses the SAC training discount.
reward_norm_epsilon: 1e-8 # Numerical floor added to each task's running return variance.
reward_norm_clip: 10.0 # Symmetric bound applied after reward normalization.

# Observation normalization 
obs_norm: true 
