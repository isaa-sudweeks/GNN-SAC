defaults:
  - gnn_config
  - _self_

# Accelerator-native fixed-topology collection. Select this profile with:
# python sac/gnn_train.py --config-name gnn_mjx
mujoco_backend: mjx
eval_backend: mujoco
use_control_graph: true
truss_realistic: false
truss_topologies: null
domain_randomization: false
domain_randomization_params:
  # MJX owns one compiled model per topology bucket, so model-changing
  # geometry and physical-parameter randomization must stay off in this profile.
  length_scale:
    enabled: false
  body_mass_multiplier:
    enabled: true
    min: 0.8
    max: 1.2
  body_inertia_multiplier:
    enabled: true
    min: 0.8
    max: 1.2
  dof_damping_multiplier:
    enabled: true
    min: 0.8
    max: 1.2
  actuator_gain_multiplier:
    enabled: true
    min: 0.8
    max: 1.2
  actuator_bias_multiplier:
    enabled: true
    min: 0.8
    max: 1.2
  geom_friction_slide:
    enabled: true
    min: 0.6
    max: 1.4
  gravity_z:
    enabled: true
    min: -10.5
    max: -9.1
num_envs: 256 # Total environments; mixed-topology MJX runs split this evenly across truss_topologies.
device: cuda
save_video: false
mjx_zero_copy: true
