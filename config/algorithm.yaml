# @package _global_

# Optimizer
lr: 3e-4 # Adam learning rate for actor and critic optimizers.
batch_size: 256 # Number of replay slices sampled for each gradient update.
grad_clip_norm: 10.0 # Maximum global gradient norm before clipping optimizer steps.
pcgrad: false # Project conflicting per-task actor and critic gradients before optimizer steps.
gradient_diagnostics: false # Compare task-specific actor and critic gradients without changing the optimizer update.
gradient_diagnostics_freq: 100 # Optimizer-update interval for gradient diagnostics when enabled.

# Replay and update cadence
buffer_size: 1_000_000 # Maximum number of transitions stored in replay.
horizon: 2 # Sequence length used by the slice sampler; 2 gives one current/next transition.
replay_ratio: 10.0 # Replay samples consumed per new transition; updates are replay_ratio * collected / batch_size.
update_every_vector_steps: 1 # Spend accumulated update budget after this many vector-environment steps; set to 1 for every step.
iterations: null # Deprecated legacy optimizer updates per transition. Set only to reproduce the old update schedule.

# SAC objective
entropy_coef: 0.2 # Weight on policy entropy in the actor objective.
target_entropy: auto # SAC entropy target; auto uses -action_dim.
tau: 0.005 # Polyak averaging rate for target critic updates and running value scale.
rho: 0.5 # Temporal weighting factor for multi-step policy losses.
discount_denom: 500 # Episode-length denominator used to derive the discount heuristic.
discount_min: 0.95 # Lower bound for the derived discount factor.
discount_max: 0.995 # Upper bound for the derived discount factor; MuJoCo wrapper may lower this.

# Actor-critic architecture
mlp_dim: 256 # Hidden width for the MLP actor and critic networks.
dropout: 0.0 # Dropout probability in critic MLP layers.
num_q: 2 # Number of critic networks in the Q ensemble.
log_std_min: -10.0 # Minimum actor log standard deviation before action sampling.
log_std_max: 2.0 # Maximum actor log standard deviation before action sampling.

# Optional finite-horizon collapse constraint
safety_constraint:
  enabled: false # Add twin collapse-probability critics and topology-specific Lagrange multipliers.
  horizon: 250 # Immutable maximum number of future steps represented by the cost critic.
  default_budget: 0.10 # Default maximum H-step collapse probability for every topology.
  budgets_by_topology: {} # Optional topology-name overrides, for example {henneberg_n6_1tube_2: 0.15}.
  cost_critic_lr: 3e-4 # Adam learning rate for the twin cost critics.
  lambda_lr: 1e-3 # Adam learning rate for topology-specific multipliers.
  lambda_init: 0.1 # Initial nonnegative multiplier value.
  lambda_max: 100.0 # Maximum multiplier value; saturation is logged.
  lambda_batch_size: 32 # Resolved reset windows required for one multiplier update.
  diagnostics_freq: 100 # Optimizer-update interval for bounded actor/critic safety diagnostics.
  curriculum:
    enabled: false # Grow a separate active safety horizon for each topology.
    initial_horizon: 50 # Starting actor, critic-sampling, evaluation, and multiplier horizon.
    promotion_factor: 1.5 # Monotonic multiplicative horizon increase after sustained success.
    consecutive_success_windows: 3 # Passing multiplier batches required before promotion.
    boundary_sample_probability: 0.50 # Cost-critic samples placed exactly at the active horizon.
    upper_half_sample_probability: 0.25 # Additional samples drawn from the active range's upper half.
