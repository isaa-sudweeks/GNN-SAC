defaults:
  - gnn_config
  - override hydra/launcher: submitit_slurm
  - _self_

# Stable run identity for preemptible/requeued jobs. Override run_root or set
# GNN_SAC_RUN_ROOT to place checkpoints on persistent shared storage.
run_root: ${oc.env:GNN_SAC_RUN_ROOT,${hydra:runtime.cwd}/runs}
work_dir: ${run_root}/${task}/${exp_name}/seed_${seed}
resume_from_checkpoint: latest
checkpoint_freq: 10_000
checkpoint_keep_last: 5
set_wandb_offline: true

# Submitit uses this Slurm launcher only in Hydra multirun mode:
# python sac/gnn_train.py --config-name supercomputer --multirun
hydra:
  sweep:
    dir: ${work_dir}/hydra
    subdir: submitit
  launcher:
    timeout_min: 1440
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 8
    gpus_per_node: 1
    mem_gb: 32
    name: ${exp_name}-${seed}
    signal_delay_s: 120
    max_num_timeout: 20
    additional_parameters:
      requeue: true
