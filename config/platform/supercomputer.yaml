# @package _global_

defaults:
  - override /hydra/launcher: filtering_submitit_slurm
  - _self_

platform: supercomputer

# Stable run identity for preemptible/requeued jobs. Override run_root or set
# GNN_SAC_RUN_ROOT to place checkpoints on persistent shared storage.
run_root: ${oc.env:GNN_SAC_RUN_ROOT,/home/isuds/robotics/GNN-SAC/runs}
work_dir: ${run_root}/${task}/${exp_name}/seed_${seed}
# Append a stable Hydra job number and override hash during multirun execution.
isolate_multirun_runs: true
resume_from_checkpoint: latest
checkpoint_freq: 100_000
checkpoint_keep_last: 5
set_wandb_offline: true
device: cuda
mjx_impl: warp # Use the NVIDIA Warp MJX implementation for supercomputer runs.
num_envs: 1536 # Total training environments across all configured topologies.

# Submitit uses this Slurm launcher only in Hydra multirun mode.
hydra:
  sweep:
    dir: ${run_root}/hydra/${task}/${exp_name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    setup:
      - export PYTHONPATH=${oc.env:PWD}/sac:${oc.env:PWD}:${oc.env:PYTHONPATH,}
      - export TMPDIR=${run_root}/tmp/$SLURM_JOB_ID-$SLURM_ARRAY_TASK_ID
      - export TORCHINDUCTOR_CACHE_DIR=${run_root}/cache/torchinductor-$SLURM_JOB_ID-$SLURM_ARRAY_TASK_ID
      - mkdir -p "$TMPDIR" "$TORCHINDUCTOR_CACHE_DIR"
    # Positive allowlist: the CUDA 13 JAX wheels require SM >= 7.5.
    # ORC msg/V100 (SM 7.0), m9g/P100, and m8g/K80 are incompatible.
    # Only x86 GPU pools: cs/cssp1/dw/dwmatrix=A100, cs2=H100,
    # cs3=B200, eng/m13h=H200, m13l=L40S. Do not admit ARM mgh nodes.
    partition: cs,cssp1,cs2,cs3,eng,dw,dwmatrix,m13l,m13h
    timeout_min: 1440
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 5
    gpus_per_node: 1
    mem_gb: 128
    name: ${exp_name}-${seed}
    signal_delay_s: 120
    max_num_timeout: 20
    qos: standby
    account: nusey
    additional_parameters:
      # Extra defense if the positive partition allowlist is overridden.
      exclude: m9g-[1-2]-[1-20]
      # Explicitly propagate the original sweep command captured by the
      # launcher process into every Submitit worker.
      export: ALL,GNN_SAC_LAUNCH_COMMAND
      requeue: true
