defaults:
  - algorithm
  - environment
  - _self_

# Run identity
project: gnn-sac # Experiment tracking project name.
exp_name: truss-velocity-command # Human-readable experiment/run name.
seed: 1 # Random seed for Python, NumPy, PyTorch, and environment sampling.
device: cpu # Torch device used for model training; use cpu when CUDA is unavailable.
work_dir: ??? # Output directory; Hydra fills this when left unresolved.

# Training schedule
steps: 1_000_000 # Total environment steps to collect before ending training.
seed_steps: 5_000 # Random-action steps collected before policy updates begin; may be raised by env setup.
pretrain_steps: 1_000 # Number of updates to run once when seed data first becomes available.
eval_freq: 10_000 # Environment-step interval between evaluation passes.
eval_episodes: 10 # Number of episodes averaged for each evaluation pass.

# Experiment behavior
episodic: true # Whether true environment terminations should stop bootstrap targets.
multitask: false # Whether to build a multitask wrapper over several environments.
tasks: # Task list used by multitask code paths and logging.
  - ${task}

# Outputs and logging
save_csv: true # Whether to write evaluation metrics to eval.csv.
save_agent: true # Whether to save final model weights at the end of training.
save_video: false # Whether to render and log video for the first evaluation episode.
enable_wandb: true # Whether to send metrics, config, video, and artifacts to Weights & Biases.
wandb_project: ${project} # W&B project name.
wandb_entity: null # Optional W&B entity/team; null uses the local default.
wandb_name: ${exp_name}-${seed} # W&B run name.
wandb_silent: true # Whether to silence W&B console output.
