# @package _global_

defaults:
  - /config
  - override /sac_backend: gnn
  - _self_

# Checkpoint source. Accepted values:
# - Local path, e.g. model=/path/to/final.pt
# - W&B artifact ref, e.g. model=entity/project/artifact-name:latest
# - W&B artifact URL from the browser
# - W&B run file URL pointing at a .pt file
model: ???

# Optional file name inside a W&B artifact directory. If omitted, the script
# looks for models/final.pt, final.pt, then a single *.pt file.
model_file: null

# Inference behavior
episodes: 5
deterministic: true
scale: 1.0 # Fixed mujoco-truss-gen robot geometry scale for generated truss tasks.
inference_max_steps: null
output_csv: null
print_position_command: true
position_command_step: null # If set, print the integrated position command after this many inference steps.
position_command_dt: null # Optional integration dt override. Defaults to MuJoCo timestep * nsubsteps.
visualize: false
visualize_realtime: true
visualize_smooth: true
visualize_fps: 60
visualize_speed: 1.0
visualize_sleep: 0.0

# Keep a single MuJoCo model across episodes. Training enables model-replacing
# domain randomization, which is incompatible with reusing the macOS passive viewer.
domain_randomization: false

# Keep training-side logging disabled during standalone inference.
enable_wandb: false
save_agent: false
save_csv: false
save_video: false
