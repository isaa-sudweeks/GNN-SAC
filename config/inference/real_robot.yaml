# @package _global_

defaults:
  - /config
  - override /sac_backend: gnn
  - _self_

model: ???
model_file: null
serial_map_file: ???
tracker_assignment: automatic # automatic, manual, or triangle_planes
tracker_layout_file: null # Required for manual/triangle_planes; optional calibration for automatic.
plane_parallel_tolerance: 1.0e-6
control_frequency_hz: 10.0
control_steps: null
velocity_filter_alpha: 1.0
deterministic: true

# Print-only USB transmitter settings. Future serial I/O should append "\n" and
# write these same commands at 115200 baud.
serial_port: null
serial_baud_rate: 115200
serial_node_order: null # null uses actuated nodes in mujoco-truss-gen graph order.
serial_max_velocity_ticks_per_second: 1800
serial_command_duration_s: 0.2

# Current MuJoCo graph observations center x/y but preserve absolute z above ground.
# Use [true, true, true] only for a checkpoint trained with fully COM-relative xyz.
com_relative_axes: [true, true, false]

# Must match the observation preprocessing and graph architecture used in training.
normalize_observations: true
domain_randomization: false

# Can instead be placed in tracker_layout_file. SteamVR and the policy use
# opposite y/z axis conventions: policy (x, y, z) = SteamVR (x, z, y).
steamvr_to_policy_matrix: [[1, 0, 0], [0, 0, 1], [0, 1, 0]]

enable_wandb: false
save_agent: false
save_csv: false
save_video: false
