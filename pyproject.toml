[project]
name = "gnn-sac"
version = "0.1.0"
description = "Graph neural network Soft Actor-Critic for variable-topology truss robots"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "gymnasium[mujoco]",
    "hydra-core",
    "hydra-submitit-launcher",
    "mujoco",
    "mujoco-mjx",
    "mujoco-truss-gen>=0.11.2",
    "numpy",
    "omegaconf",
    "optuna",
    "tensordict",
    "termcolor",
    "torch>=2.11.0",
    "torch-geometric",
    "wandb[media]",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
