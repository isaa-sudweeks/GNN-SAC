[project]
name = "gnn-sac"
version = "0.1.0"
description = "Graph neural network Soft Actor-Critic for variable-topology truss robots"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "gymnasium[mujoco]",
    "hydra-core",
    "hydra-submitit-launcher",
    "jax[cuda13]>=0.11.0; sys_platform == 'linux'",
    "jax>=0.11.0; sys_platform != 'linux'",
    "mujoco",
    "mujoco-mjx",
    "mujoco-truss-gen>=0.12.2",
    "numpy",
    "openvr==2.5.102",
    "omegaconf",
    "optuna",
    "pandas",
    "plotly",
    "kaleido",
    "setuptools==81.0.0",
    "tensordict",
    "termcolor",
    "torch>=2.11.0",
    "torch-geometric",
    "wandb[media]",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
